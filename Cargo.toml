[workspace]
members = [
  "apps/desktop/src-tauri",
  "crates/desktop-notes-core",
  "crates/desktop-notes-infra",
  "crates/desktop-notes-windows",
  "spikes/S08-window-layer",
  "spikes/S10-hotkey-clipboard",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.98"

[workspace.dependencies]
aes-gcm = { version = "=0.11.1", features = ["aes", "alloc", "zeroize"] }
base64 = "=0.22.1"
dirs = "=6.0.0"
getrandom = "=0.4.3"
hkdf = "=0.13.0"
image = { version = "=0.25.10", default-features = false, features = ["bmp", "jpeg", "png", "webp"] }
rusqlite = { version = "=0.40.2", default-features = false, features = ["backup", "bundled-sqlcipher-vendored-openssl"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["preserve_order"] }
sha2 = "=0.11.0"
tauri = { version = "=2.11.5" }
tauri-build = { version = "=2.6.3" }
tauri-plugin-global-shortcut = { version = "=2.3.2" }
tauri-runtime = { version = "=2.11.3" }
thiserror = "=2.0.20"
unicode-normalization = "=0.1.25"
url = "=2.5.8"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_SystemInformation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
windows = { version = "=0.61.3", features = ["UI_ViewManagement"] }
zeroize = "=1.9.0"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[patch.crates-io]
libsqlite3-sys = { path = "third_party/libsqlite3-sys-0.38.2-sqlcipher-4.18.0" }
